<!DOCTYPE html>
<html lang="🟦">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>r8.upsilon.media</title>
    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            background-color: #000; color: #fff;
            display: flex; justify-content: center; align-items: center;
            font-family: 'Courier New', Courier, monospace; overflow: hidden;
            cursor: default;
        }

        .top-left { position: absolute; top: 25px; left: 25px; z-index: 10; }

        .video-container {
            width: 80px; margin-top: 10px; transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer; border-radius: 5px; overflow: hidden;
        }
        .video-container:hover { transform: scale(0.9); box-shadow: 0 0 20px rgba(0, 150, 255, 0.5); }
        video { width: 100%; display: block; pointer-events: none; }

        .center-text { font-size: 1.2rem; letter-spacing: 0.2em; text-align: center; z-index: 1; }

        #text-reveal-container {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none; z-index: 6;
            color: rgba(255, 255, 255, 0.5);
            mask-image: radial-gradient(circle 200px at var(--mouse-x) var(--mouse-y), white 0%, transparent 80%);
            -webkit-mask-image: radial-gradient(circle 200px at var(--mouse-x) var(--mouse-y), white 0%, transparent 80%);
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        #plasma-layer {
            position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
            pointer-events: none; z-index: 5; opacity: 0;
            background: radial-gradient(circle 200px at var(--mouse-x) var(--mouse-y), rgba(0, 100, 255, 0.2) 0%, rgba(0, 0, 0, 0) 80%);
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>

    <div class="top-left">
        <div>🆈 r8.𝘂𝗽𝘀𝗶𝗹𝗼𝗻.media</div>
        <div class="video-container" id="trigger-btn">
            <video src="https://raw.githubusercontent.com/666F78646965/r8.upsilon.media/main/cube.mp4" autoplay muted loop playsinline></video>
        </div>
    </div>

    <div id="plasma-layer"></div>
    
    <div id="text-reveal-container">
        <div id="hidden-content" style="font-size: 1.5rem; word-break: break-all; padding: 20px; text-align: center;">
            aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        </div>
    </div>

    <div class="center-text">ＡＩ ＋ ＨＵＭＡＮ<br> ＣＯＬＬＡＢＯＲＡＴＩＯＮ</div>

    <script>
        const btn = document.getElementById('trigger-btn');
        const plasma = document.getElementById('plasma-layer');
        const reveal = document.getElementById('text-reveal-container');
        let isDragging = false;

        const updatePosition = (e) => {
            const x = e.clientX || (e.touches && e.touches[0].clientX);
            const y = e.clientY || (e.touches && e.touches[0].clientY);
            document.documentElement.style.setProperty('--mouse-x', x + 'px');
            document.documentElement.style.setProperty('--mouse-y', y + 'px');
        };

        window.addEventListener('mousedown', () => { isDragging = true; plasma.style.opacity = '1'; reveal.style.opacity = '1'; });
        window.addEventListener('mouseup', () => { isDragging = false; plasma.style.opacity = '0'; reveal.style.opacity = '0'; });
        window.addEventListener('mousemove', (e) => { if (isDragging) updatePosition(e); });
        window.addEventListener('touchstart', (e) => { isDragging = true; plasma.style.opacity = '1'; reveal.style.opacity = '1'; updatePosition(e.touches[0]); });
        window.addEventListener('touchend', () => { isDragging = false; plasma.style.opacity = '0'; reveal.style.opacity = '0'; });
        window.addEventListener('touchmove', (e) => { if (isDragging) updatePosition(e.touches[0]); });
        
        btn.addEventListener('click', () => {
            if(confirm("Redirect to x.com.r8.upsilon.media?")) {
                window.location.href = "https://x.com.r8.upsilon.media";
            }
        });
    </script>
</body>
</html>
